# Ambiente de desenvolvimento/demonstração. Credenciais apenas locais e fictícias.
x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://frota:frota@postgres:5432/frota
  TEST_DATABASE_URL: postgresql+psycopg://frota:frota@postgres:5432/frota_test
  DB_SQL_DIR: /db

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: frota
      POSTGRES_PASSWORD: frota
      POSTGRES_DB: frota
    ports:
      - "5433:5432"
    volumes:
      # Na primeira subida: cria frota_test, o schema e os dados fictícios.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frota -d frota"]
      interval: 3s
      retries: 20

  logistica-api:
    build: ./logistica-api
    environment:
      <<: *api-env
      # IA local: Ollama rodando na máquina (fora do Docker, para usar a GPU). Sem ele, a tela avisa
      # "IA indisponível" e o de-para segue com as sugestões por semelhança.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODELO: ${OLLAMA_MODELO:-qwen2.5:7b}
      IA_VERSAO_PROMPT: ${IA_VERSAO_PROMPT:-v2}
      IA_MAX_CANDIDATAS: "5"
      IA_TIMEOUT_S: "90"
      IA_HABILITADA: ${IA_HABILITADA:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8000"
    volumes:
      - ./db:/db:ro
      - ./relatorios:/app/relatorios
    depends_on:
      postgres:
        condition: service_healthy

  cautela-api:
    build: ./cautela-api
    environment: *api-env
    ports:
      - "8002:8000"
    volumes:
      - ./db:/db:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      LOGISTICA_API_URL: http://logistica-api:8000
      CAUTELA_API_URL: http://cautela-api:8000
    ports:
      - "5173:5173"
    depends_on:
      - logistica-api
      - cautela-api
